<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticho za zdmi — Příběhy a mapa psychiatrické péče v ČR a SR</title>
    <meta
      name="description"
      content="Nezávislá platforma a interaktivní mapa pro anonymní sdílení příběhů, hodnocení kvality péče a dokumentaci nedostatků v psychiatrických nemocnicích a léčebnách v ČR a SR."
    />
    <meta property="og:title" content="Ticho za zdmi — Příběhy a mapa psychiatrické péče v ČR a SR" />
    <meta
      property="og:description"
      content="Nezávislá platforma a interaktivní mapa pro anonymní sdílení příběhů, hodnocení kvality péče a dokumentaci nedostatků v psychiatrických nemocnicích a léčebnách v ČR a SR."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:ital,wght@0,400..700;1,400..600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ticho-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-primary/20 selection:text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
